<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Greenland – Diary</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: white;
      color: black;
      text-align: center;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 20px;
      padding: 30px 0 5px 0;
      font-size: 16px;
    }

    nav a {
      text-decoration: none;
      color: black;
    }

    h1 {
      font-size: 22px;
      letter-spacing: 1px;
      margin-top: 20px;
    }

    .button-row {
      margin-top: 40px;
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .menu-btn {
      padding: 12px 0;
      width: 150px;
      border: 1px solid #ccc;
      background: white;
      font-size: 16px;
      text-decoration: none;
      color: black;
      transition: 0.2s;
      display: inline-block;
      text-align: center;
    }

    .menu-btn:hover {
      background: #e6e6e6;
    }

    .selected {
      background: #e6e6e6;
      cursor: default;
    }

    .book-icons {
      margin-top: 50px;
      display: flex;
      justify-content: center;
      gap: 80px;
      flex-wrap: wrap;
    }

    .book-icon {
      width: 260px;
      height: 360px;
      border: 1px solid #cfc7b8;
      background: #f7f3e9;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: 0.35s ease;
      box-shadow: 0 4px 14px rgba(0,0,0,0.12);
      border-radius: 6px;
    }

    .book-icon:hover {
      transform: translateY(-4px) rotate(-1deg);
      box-shadow: 0 10px 22px rgba(0,0,0,0.18);
      background: #f3ecdf;
    }

    .open-book {
      width: 170px;
      height: 210px;
      display: flex;
      justify-content: center;
      align-items: stretch;
      margin-bottom: 20px;
      position: relative;
      transform: rotate(-1deg);
    }

    .page {
      flex: 1;
      background: #faf4e6;
      border: 1px solid #d8d0c0;
      box-shadow: inset 0 0 8px rgba(0,0,0,0.10);
      border-radius: 4px;
      position: relative;
      overflow: hidden;
    }

    .footer {
      margin-top: 60px;
      font-size: 16px;
      color: #555;
      padding-bottom: 40px;
    }

    /* ---------------------- READER ---------------------- */

    #reader {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      overflow-y: auto;
      background: #f7f3e9;
      z-index: 9999;
    }

    .page-container {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      padding: 20px 0;
      position: relative;
    }

    .page-container img {
      max-height: 93vh;
      width: auto;
      height: auto;
      object-fit: contain;
      border: none;
    }

    /* Numero pagina dentro l’immagine */
    .caption {
      position: absolute;
      bottom: 12px;
      right: 12px;
      background: rgba(0,0,0,0.45);
      color: white;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 14px;
      pointer-events: none;
    }

    /* ---------------------- PULSANTI LATERALI ---------------------- */

    .nav-buttons {
      position: fixed;
      top: 50%;
      left: 0;
      width: 100%;
      height: 0;
      pointer-events: none;
      z-index: 99999;
    }

    .nav-btn {
      position: absolute;
      width: 90px;
      height: 70px;
      background: white;
      border: 1px solid #ccc;
      cursor: pointer;
      pointer-events: auto;
    }

    /* Sinistra */
    #backBtn { left: 10px; top: -60px; }
    #infoBtn { left: 10px; top: 0px; }

    /* Destra */
    #nextBtn { right: 10px; top: -60px; }
    #backToBooks { right: 10px; top: 0px; }

    /* ---------------------- MODAL ---------------------- */

    #infoModal {
      display:none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(2px);
      justify-content: center;
      align-items: center;
      z-index: 10000;
    }

    #infoBox {
      background: white;
      padding: 25px;
      width: 90%;
      max-width: 450px;
      border: 1px solid #ccc;
      text-align: left;
    }

  </style>
</head>

<body>

  <nav id="menu">
    <a href="index.html">Home</a>
    <a href="progetto.html">CIMA Project</a>
    <a href="galleria-intermedia.html">Virtual Exhibitions</a>
    <a href="opere.html">Works</a>
    <a href="book.html">Book</a>
    <a href="news.html">News</a>
    <a href="biography.html">Biography</a>
    <a href="contatti.html">Contacts</a>
    <a href="work-in-progress.html">Buy</a>
  </nav>

  <h1 id="title">Greenland – Diary</h1>

  <div class="button-row" id="sectionButtons">
    <a href="archive-greenland.html" class="menu-btn">Photography</a>
    <a href="greenland-video.html" class="menu-btn">Video</a>
    <a href="g-drawing.html" class="menu-btn">Drawings</a>
    <a href="greenland-diary.html" class="menu-btn selected">Diary</a>
  </div>

  <div id="bookChoice">
    <h2>Diary – Choose your language</h2>

    <div class="book-icons">

      <div class="book-icon" onclick="openBook('en')">
        <div class="open-book">
          <div class="page"></div>
          <div class="page"></div>
        </div>
        <strong>GREENLAND</strong>
        <span>Diary – EN</span>
      </div>

      <div class="book-icon" onclick="openBook('it')">
        <div class="open-book">
          <div class="page"></div>
          <div class="page"></div>
        </div>
        <strong>GROENLANDIA</strong>
        <span>Diario – IT</span>
      </div>

    </div>
  </div>

  <div class="footer" style="
  margin-top: 35px;
  font-size: 16px;
  color: #555;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 14px;
">

  <div><strong>Giorgio Sedda</strong> – CIMA Project</div>

  <a href="https://www.instagram.com/artdrawingtime2025/"
     target="_blank"
     style="text-decoration:none; color:#555; display:flex; align-items:center;">

    <svg width="18" height="18" viewBox="0 0 256 256" style="opacity:0.75;">
      <defs>
        <linearGradient id="IG" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ff4d00"/>   <!-- arancio molto intenso -->
          <stop offset="30%" stop-color="#ff0090"/>  <!-- rosa neon -->
          <stop offset="60%" stop-color="#c000ff"/>  <!-- viola brillante -->
          <stop offset="100%" stop-color="#1f2fff"/> <!-- blu elettrico -->
        </linearGradient>
      </defs>

      <rect width="256" height="256" rx="60" fill="url(#IG)"/>
      <path fill="#fff" d="M128 176a48 48 0 1 1 48-48 48 48 0 0 1-48 48zm0-80a32 32 0 1 0 32 32 32 32 0 0 0-32-32zm52-28a12 12 0 1 1-12 12 12 12 0 0 1 12-12z"/>
    </svg>
  </a>
</div>


  <div id="reader">
    <div class="page-container">
      <img id="page" src="">
      <div class="caption" id="caption">Page 01</div>
    </div>

    <div class="nav-buttons">
      <button id="backBtn" class="nav-btn">Back</button>
      <button id="infoBtn" class="nav-btn">Info</button>
      <button id="nextBtn" class="nav-btn">Next</button>
      <button id="backToBooks" class="nav-btn" onclick="closeBook()">Back to languages</button>
    </div>
  </div>

  <div id="infoModal">
    <div id="infoBox">
      <h2 style="margin-top:0; font-size:18px;">Technical Sheet</h2>

      <div id="modalContent" style="font-size:15px; line-height:1.5;"></div>

      <div style="margin-top:20px; display:flex; justify-content:flex-end;">
        <button id="closeModal" style="
          padding: 8px 18px;
          background:white;
          border:1px solid #ccc;
          cursor:pointer;
        ">Close</button>
      </div>
    </div>
  </div>

  <script>
    let lang = "";
    let index = 1;
    let pages = [];

    async function detectPages(selectedLang) {
      const detected = [];
      let n = 1;

      while (true) {
        const filename = `L-${selectedLang}${n}.jpg`;

        try {
          const response = await fetch(filename, { method: "HEAD" });
          if (!response.ok) break;
          detected.push(filename);
          n++;
        } catch (e) {
          break;
        }
      }

      return detected;
    }

    async function openBook(selectedLang) {
      lang = selectedLang;
      index = 0;

      pages = await detectPages(lang);

      if (pages.length === 0) {
        alert("No pages found for this language.");
        return;
      }

      document.getElementById("menu").style.display = "none";
      document.getElementById("title").style.display = "none";
      document.getElementById("sectionButtons").style.display = "none";
      document.getElementById("bookChoice").style.display = "none";

      document.getElementById("reader").style.display = "block";

      updatePage();
    }

    function closeBook() {
      document.getElementById("menu").style.display = "flex";
      document.getElementById("title").style.display = "block";
      document.getElementById("sectionButtons").style.display = "flex";
      document.getElementById("bookChoice").style.display = "block";

      document.getElementById("reader").style.display = "none";
    }

    function updatePage() {
      const file = pages[index];
      document.getElementById("page").src = file;

      const num = String(index + 1).padStart(2, "0");
      document.getElementById("caption").textContent = `Page ${num}`;
    }

    document.getElementById("backBtn").onclick = () => {
      if (index > 0) {
        index--;
        updatePage();
      }
    };

    document.getElementById("nextBtn").onclick = () => {
      if (index < pages.length - 1) {
        index++;
        updatePage();
      }
    };

    document.getElementById("infoBtn").onclick = () => {
      const num = String(index + 1).padStart(2, '0');

      document.getElementById("modalContent").innerHTML = `
        <strong>Title:</strong> Greenland – Diary<br>
        <strong>Page:</strong> ${num}<br>
        <strong>Language:</strong> ${lang === "en" ? "English" : "Italian"}<br>
        <strong>Author:</strong> Giorgio Sedda<br>
        <strong>Project:</strong> Un monde couleurs Project + CIMA Project<br>
        <strong>Technique:</strong> Travel diary narrative<br>
        <strong>Year:</strong> 2023–2026<br><br>
        This page is part of the narrative diary created during the winter journey in Greenland.
      `;

      document.getElementById("infoModal").style.display = "flex";
    };

    document.getElementById("closeModal").onclick = () => {
      document.getElementById("infoModal").style.display = "none";
    };

    document.getElementById("infoModal").onclick = (e) => {
      if (e.target === document.getElementById("infoModal")) {
        document.getElementById("infoModal").style.display = "none";
      }
    };
  </script>

</body>
</html>
