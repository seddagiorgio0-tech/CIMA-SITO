<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Africa – Drawings</title>

<style>

/* ============================================================
   STRUTTURA BASE
============================================================ */
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: white;
  font-family: Arial, sans-serif;
  color: black;
  text-align: center;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ============================================================
   NAVIGAZIONE
============================================================ */
nav {
  display: flex;
  justify-content: center;
  gap: 20px;
  padding: 25px 0 5px 0;
  font-size: 16px;
  flex-shrink: 0;
}
nav a {
  text-decoration: none;
  color: black;
}

/* ============================================================
   TITOLO
============================================================ */
h1 {
  font-size: 22px;
  letter-spacing: 1px;
  margin: 10px 0 15px 0;
  flex-shrink: 0;
}

/* ============================================================
   MENU AFRICA (AGGIUNTO)
============================================================ */
.button-row {
  margin-top: 10px;
  display: flex;
  justify-content: center;
  gap: 20px;
  flex-wrap: wrap;
}
.menu-btn {
  padding: 12px 0;
  width: 150px;
  border: 1px solid #ccc;
  background: white;
  font-size: 16px;
  text-decoration: none;
  color: black;
  transition: 0.2s;
  display: inline-block;
  text-align: center;
}
.menu-btn:hover {
  background: #e6e6e6;
}
.selected {
  background: #e6e6e6;
  color: black;
  cursor: default;
  border-color: #ccc;
}

/* ============================================================
   PULSANTI NAVIGAZIONE
============================================================ */
.nav-buttons {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 40px;
  margin: 15px auto;
  width: 43%;
  position: relative;
}
#backBtn {
  position: absolute;
  left: 0;
}

#nextBtn {
  position: absolute;
  right: 0;
}
.nav-buttons button {
  padding: 10px 20px;
  font-size: 16px;
  background: white;
  border: 1px solid #ccc;
  cursor: pointer;
  transition: 0.2s;
}
.nav-buttons button:hover {
  background: #e6e6e6;
}
.nav-buttons button:disabled {
  background: #f2f2f2;
  color: #999;
  border-color: #ddd;
  cursor: default;
}

/* ============================================================
   VIEWER
============================================================ */
.viewer {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 0;
}
.viewer img {
  width: auto;
  height: auto;
  max-height: 88vh;
  object-fit: contain;
  cursor: zoom-in;
  transition: 0.3s ease;
}

/* ============================================================
   MODAL ZOOM
============================================================ */
.img-modal {
  display: none;
  position: fixed;
  z-index: 99999;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.85);
  justify-content: center;
  align-items: center;
}
.img-modal img {
  max-width: 90%;
  max-height: 90%;
  object-fit: contain;
}
.img-modal-close {
  position: absolute;
  top: 20px;
  right: 30px;
  font-size: 32px;
  color: white;
  cursor: pointer;
}

/* ============================================================
   FOOTER
============================================================ */
.footer {
  flex-shrink: 0;
  padding: 12px 0;
  background: white;
  font-size: 16px;
  color: #555;
}

/* ============================================================
   MODAL INFO
============================================================ */
#infoModal {
  display:none;
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.55);
  backdrop-filter: blur(3px);
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

</style>
</head>
<body>

<nav>
  <a href="index.html">Home</a>
  <a href="progetto.html">CIMA Project</a>
  <a href="galleria-intermedia.html">Virtual Exhibitions</a>
  <a href="opere.html">Works</a>
  <a href="book.html">Book</a>
  <a href="news.html">News</a>
  <a href="biography.html">Biography</a>
  <a href="contatti.html">Contacts</a>
  <a href="work-in-progress.html">Buy</a>
</nav>

<h1>Africa – Drawings</h1>

<!-- BLOCCO AFRICA (AGGIUNTO) -->
<div class="button-row">
  <a href="gallery-under-construction.html" class="menu-btn">Photography</a>
  <a href="africa-video.html" class="menu-btn">Video</a>
  <a href="africa-drawing.html" class="menu-btn selected">Drawings</a>
  <a href="africa-diary.html" class="menu-btn">Diary</a>
</div>

<div class="viewer">
  <img id="drawingImg" src="a-drawing01.jpg" onclick="openModal()">
</div>

<div class="nav-buttons">
  <button id="backBtn" onclick="prevImg()" disabled>Back</button>
  <button id="infoBtn">Info</button>
  <button id="nextBtn" onclick="nextImg()">Next</button>
</div>

<div id="modal" class="img-modal" onclick="closeModal()">
  <span class="img-modal-close">&times;</span>
  <img id="modalImg" src="">
</div>

<div class="footer">
  <strong>Giorgio Sedda</strong> – CIMA Project
</div>

<div id="infoModal">
  <div style="
    background: white;
    padding: 30px;
    width: 90%;
    max-width: 500px;
    border: 1px solid #ccc;
    text-align: left;
  ">

    <h2 style="margin-top:0; font-size:20px;">Technical Sheet</h2>

    <div id="modalContent" style="font-size:16px; line-height:1.5;"></div>

    <div style="margin-top:25px; display:flex; justify-content:flex-start; gap:10px;">
      <a id="buyPrint" href="#" style="
        padding: 10px 20px;
        background:white;
        border:1px solid #ccc;
        text-decoration:none;
        color:black;
        cursor:pointer;
      ">Buy fine‑art print</a>

      <button id="closeModal" style="
        padding: 10px 20px;
        background:white;
        border:1px solid #ccc;
        cursor:pointer;
      ">Close</button>
    </div>

  </div>
</div>

<script>
let current = 1;
const max = 7;

const sizes = {
  1: 45,
  2: 44,
  3: 36,
  4: 45,
  5: 36,
  6: 26,
  7: 40
};

function applySize() {
  const img = document.getElementById("drawingImg");
  const modalImg = document.getElementById("modalImg");
  const w = sizes[current] || 70;
  img.style.maxWidth = w + "%";
  modalImg.style.maxWidth = (w + 15) + "%";
}

function updateImage() {
  document.getElementById("drawingImg").src = "a-drawing0" + current + ".jpg";
  document.getElementById("backBtn").disabled = current === 1;
  document.getElementById("nextBtn").disabled = current === max;
  applySize();
}

function nextImg() {
  if (current < max) { current++; updateImage(); }
}
function prevImg() {
  if (current > 1) { current--; updateImage(); }
}
updateImage();

function openModal() {
  document.getElementById("modalImg").src = "a-drawing0" + current + ".jpg";
  document.getElementById("modal").style.display = "flex";
  applySize();
}
function closeModal() {
  document.getElementById("modal").style.display = "none";
}

const infoBtn = document.getElementById("infoBtn");
const infoModal = document.getElementById("infoModal");
const closeModalInfo = document.getElementById("closeModal");
const modalContent = document.getElementById("modalContent");
const buyPrint = document.getElementById("buyPrint");

const sheets = {
  1: `
    <!-- Sheet removed as requested -->
    <em>No technical sheet available for this drawing.</em>
  `,

  2: `
    <strong>Title:</strong> "Cotton Field"<br>
    <strong>Technique:</strong> Pencil on paper<br>
    <strong>Size:</strong> 240 × 200 cm<br>
    <strong>Location:</strong> Togo<br>
    <strong>Year:</strong> 2020<br><br>
    In this selection of drawings from the “Africa” series, the original works are not for sale.<br><br>
    Limited‑edition fine‑art print (5 copies including 1 artist’s proof).
  `,

  3: `
    <strong>Title:</strong> "Cotton Field"<br>
    <strong>Technique:</strong> Pencil on paper<br>
    <strong>Size:</strong> 240 × 200 cm<br>
    <strong>Location:</strong> Togo<br>
    <strong>Year:</strong> 2020<br><br>
    In this selection of drawings from the “Africa” series, the original works are not for sale.<br><br>
    Limited‑edition fine‑art print (5 copies including 1 artist’s proof).
  `,

  4: `
    <strong>Title:</strong> "Last Oasis"<br>
    <strong>Technique:</strong> Charcoal on paper<br>
    <strong>Size:</strong> 180 × 160 cm<br>
    <strong>Location:</strong> Togo<br>
    <strong>Year:</strong> 2020<br><br>
    In this selection of drawings from the “Africa” series, the original works are not for sale.<br><br>
    Limited‑edition fine‑art print (5 copies including 1 artist’s proof).
  `,

  5: `
    <strong>Title:</strong> "Human Rights"<br>
    <strong>Technique:</strong> Pencil on paper<br>
    <strong>Size:</strong> 200 × 140 cm<br>
    <strong>Location:</strong> Togo<br>
    <strong>Year:</strong> 2020<br><br>
    In this selection of drawings from the “Africa” series, the original works are not for sale.<br><br>
    Limited‑edition fine‑art print (5 copies including 1 artist’s proof).
  `,

  6: `
    <strong>Title:</strong> "Portrait of a Child"<br>
    <strong>Technique:</strong> Mixed media<br>
    <strong>Size:</strong> A4<br>
    <strong>Location:</strong> Togo<br>
    <strong>Year:</strong> 2020<br><br>
    In this selection of drawings from the “Africa” series, the original works are not for sale.<br><br>
    Limited‑edition fine‑art print (5 copies including 1 artist’s proof).
  `,

  7: `
    <strong>Title:</strong> "Portrait of a Child 2"<br>
    <strong>Technique:</strong> Pencil on paper<br>
    <strong>Size:</strong> 200 × 140 cm<br>
    <strong>Location:</strong> Togo<br>
    <strong>Year:</strong> 2020<br><br>
    In this selection of drawings from the “Africa” series, the original works are not for sale.<br><br>
    Limited‑edition fine‑art print (5 copies including 1 artist’s proof).
  `
};


infoBtn.onclick = () => {
  modalContent.innerHTML = sheets[current];

  if (current === 1) {
    buyPrint.style.display = "none";
  } else {
    buyPrint.style.display = "inline-block";

    const num = String(current).padStart(2, '0');
    const baseTitle = encodeURIComponent(`Africa - Drawing ${num}`);
    buyPrint.href = `https://giorgiosedda.com/work-in-progress.html?title=${baseTitle}%20(fine-art%20print)`;
  }

  infoModal.style.display = "flex";
};

closeModalInfo.onclick = () => { infoModal.style.display = "none"; };
infoModal.onclick = (e) => { if (e.target === infoModal) infoModal.style.display = "none"; };
</script>

</body>
</html>
