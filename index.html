<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CIMA – Crossing Into My Art</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: white;
      color: black;
      text-align: center;

  /* SFONDO AGGIUNTO */
      background-image: url('prova.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    /* NAVIGAZIONE */
    nav {
      display: flex;
      justify-content: center;
      gap: 20px;
      padding: 30px 0 5px 0;
      font-size: 16px;
      position: relative;
    }

    nav a {
      text-decoration: none;
      color: black;
      font-weight: normal;
    }

    nav a.active {
      font-weight: bold;
      text-decoration: underline;
    }

    /* LOGO + NOME */
    .logo-wrapper {
      position: relative;
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      margin-top: 10px;
    }

    .logo-a {
      display: block;
      margin: 5px auto 0 auto;
      max-width: 220px;
      height: auto;
    }

    .logo-cima {
      display: block;
      margin: 0 auto;
      max-width: 260px;
      height: auto;
    }

    .name-right {
      position: absolute;
      top: 50%;
      right: -150px;
      transform: translateY(-50%);
      font-size: 22px;
      color: #555;
      font-weight: bold;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    @media (max-width: 600px) {
      .name-right {
        position: static;
        display: block;
        margin-top: 10px;
        transform: none;
        text-align: center;
      }
    }

    hr {
      width: 200px;
      margin: 5px auto;
      border: none;
      border-top: 1px solid black;
    }

    /* BLOCCO CENTRALE */
    .central-block {
      width: 720px;
      max-width: 100%;
      margin: 0 auto;
      margin-top: 40px;
    }

    /* FRASE HOME */
    .home-phrase {
      font-size: 17px;
      color: #e06f3c;
      margin: 0 auto 18px auto;
      max-width: 720px;
      line-height: 1.3;
      font-style: italic;
      font-family: Georgia, "Times New Roman", serif;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: clip;
    }

    .panoramica {
      display: block;
      width: 100%;
      height: auto;
      margin-top: 10px;
      margin-bottom: 35px;
    }

    /* PULSANTI */
    .buttons {
      width: 720px;
      max-width: 100%;
      margin: 0 auto;
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 25px;
    }

    .buttons a {
      border: 1px solid black;
      padding: 8px 16px;
      text-decoration: none;
      color: black;
      font-size: 14px;
      min-width: 140px;
      text-align: center;
      transition: 0.2s;
    }

    .buttons a:hover {
      background-color: #d9d9d9;
      color: black;
    }

    /* FOOTER */
    .footer {
      margin-top: 35px;
      font-size: 16px;
      color: #555;
    }
  </style>
</head>

<body>

  <nav>
    <a href="index.html" class="active">Home</a>
    <a href="progetto.html">CIMA Project</a>
    <a href="galleria-intermedia.html">Virtual Exhibitions</a>
    <a href="opere.html">Works</a>
    <a href="book.html">Book</a>
    <a href="news.html">News</a>
    <a href="biography.html">Biography</a>
    <a href="contatti.html">Contacts</a>
    <a href="work-in-progress.html">Buy</a>
  </nav>

  <div class="logo-wrapper">
    <img src="logo-a.png" alt="CIMA symbol" class="logo-a">
    <img src="logo-cima.png" alt="CIMA – Crossing Into My Art" class="logo-cima">
    <div class="name-right">GIORGIO SEDDA</div>
  </div>

  <hr>

  <div class="central-block">

    <div class="home-phrase">
      “Ho imparato che la bellezza nasce nell’incontro, anche quando non tutto si può comprendere”
    </div>

    <img src="panoramica-home.jpg" alt="Panoramic image" class="panoramica">

    <div class="buttons">
      <a href="galleria-intermedia.html">Virtual Gallery</a>
      <a href="opere.html">Works Archive</a>
      <a href="progetto.html">CIMA Project</a>
      <a href="contatti.html">Contacts</a>
    </div>
  </div>

  margin-top: 35px;

</body>
